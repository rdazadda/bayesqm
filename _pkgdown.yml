url: https://rdazadda.github.io/bayesqm/

template:
  bootstrap: 5
  bslib:
    primary:   "#1E3A5F"
    secondary: "#DF6A2E"
    success:   "#71984A"
    info:      "#87D1E6"
    warning:   "#FFCD00"
    danger:    "#F45197"
    headings-color: "#1E3A5F"
    link-color:     "#2C5282"
    base_font:    {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font:    {google: "JetBrains Mono"}

navbar:
  bg: primary
  type: dark
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: "Get started"
      href: articles/bayesqm-intro.html
    reference:
      text: "Reference"
      href: reference/index.html
    github:
      icon: fa-github
      href: https://github.com/rdazadda/bayesqm
      aria-label: GitHub

home:
  sidebar:
    structure: [links, citation, authors, license, dev]
    components:
      links:
        title: "Links"
        text: |
          * [Browse source](https://github.com/rdazadda/bayesqm)
          * [Report a bug](https://github.com/rdazadda/bayesqm/issues)

reference:
  - title: "Model fitting"
    desc: >
      Fit the exact partition-likelihood model, continue a gated chain,
      and realign draws.
    contents:
      - fit_bayesian
      - extend
      - matchalign
      - delta_grid

  - title: "The tables"
    desc: >
      The familiar Q outputs as posterior summaries, and the one
      false-discovery rule behind every claim.
    contents:
      - compute_loadings
      - compute_flags
      - compute_zscores
      - compute_factor_array
      - compute_qdc
      - factor_characteristics
      - crib_sheet
      - claims

  - title: "Model checking and choice of K"
    contents:
      - check_fit
      - check_persons
      - fit_ladder
      - select_k
      - loo_ladder
      - loglik_person

  - title: "Rotation and reporting"
    contents:
      - rotate_factors
      - flip_factor
      - rename_factors

  - title: "Plots"
    desc: >
      Base-graphics views of the fit; `ggplot2::autoplot()` serves the
      flagship four (loadings, flags, contrasts, array).
    contents:
      - plot.bayesqm_fit
      - plot_sorts
      - plot_zscores
      - plot_statement
      - plot_loading_posterior
      - plot_flags
      - plot_factor_array
      - plot_contrasts
      - plot_choice_k
      - plot_person_check
      - plot_convergence
      - plot_ppc

  - title: "Theming and export"
    contents:
      - bayesqm_colors
      - save_bayesqm_plot
      - caption_bayesqm

  - title: "Standard accessors for a bayesqm_fit"
    contents:
      - coef.bayesqm_fit
      - fitted.bayesqm_fit
      - sigma.bayesqm_fit
      - posterior_interval
      - posterior_interval.bayesqm_fit
      - prior_summary
      - prior_summary.bayesqm_fit

  - title: "Data: import and construction"
    desc: "Readers for CSV/Excel/PQMethod/Ken-Q/KADE/HTMLQ, the `qsort_data` object, and the shipped example panel."
    contents:
      - read_qsort
      - import.pqmethod
      - qsort_data
      - qsort_data-methods
      - validate_qsort
      - obesity_sorts
      - grizzly_sorts

  - title: "Demonstration and synthetic panels"
    desc: >
      A fast demonstration fit, synthetic panels with known truth, and
      recovery measures for method checks.
    contents:
      - demo_fit
      - generate_data
      - assess_recovery
      - tucker_congruence

  - title: "Defunct"
    contents:
      - bayesqm-defunct

footer:
  structure:
    left:  [developed_by, built_with]
    right: [package]
  components:
    package: "bayesqm &middot; CANHR, University of Alaska Fairbanks"

authors:
  Raymond Dacosta Azadda:
    href: "https://github.com/rdazadda"
