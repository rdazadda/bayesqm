# Companion to R-CMD-check.yaml: runs R CMD check on a single Ubuntu
# slot with cmdstanr + a real CmdStan install, so the Stan-sampling
# tests in tests/testthat/test-stan-sampling.R actually execute (their
# skip_if_no_stan() guard returns FALSE here). Kept separate from the
# main 5-OS matrix so a CmdStan upstream hiccup does not red-X PRs
# that do not touch Stan code.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check-stan.yaml

permissions: read-all

jobs:
  R-CMD-check-stan:
    runs-on: ubuntu-latest

    name: ubuntu-latest (release) + cmdstan

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          extra-repositories: |
            https://stan-dev.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::cmdstanr
          needs: check

      - name: Install CmdStan
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan(cores = parallel::detectCores())
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
