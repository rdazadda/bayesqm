# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # macos-13 is x86_64; macos-latest (macos-14) is aarch64 / Apple
          # Silicon, where diffobj's pre-built binary intermittently segfaults
          # in dyn.load when waldo renders a failed-test diff. Pinning to
          # macos-13 mirrors CRAN's own macOS test platform.
          - {os: macos-13,       r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Stan backends (cmdstanr, rstan) are in Suggests and gated at runtime;
      # they are heavy to install on CI and cmdstanr is not on CRAN, so do not
      # treat their absence as a check failure.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          # cmdstanr lives on the Stan team's r-universe, not CRAN.
          # `extra-repositories` is an input of setup-r (not of
          # setup-r-dependencies); the URL is written into the runner's
          # repos option so pak sees it during dependency resolution.
          extra-repositories: 'https://stan-dev.r-universe.dev'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Listing cmdstanr in extra-packages forces pak to install it
          # from the r-universe configured above, rather than treating
          # it as a soft Suggests that pak can silently drop.
          extra-packages: |
            any::rcmdcheck
            any::cmdstanr
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
